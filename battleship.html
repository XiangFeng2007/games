<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover">
<title>海战棋 · Battleship</title>
<style>
/* ===================== 主题 ===================== */
:root{
  --panel:rgba(255,255,255,.055);
  --panel-line:rgba(255,255,255,.12);
  --text:#e8ecff;
  --muted:#8f9ac0;
  --accent:#6ea8ff;
  --accent2:#a06bff;
  --ok:#3ddc97;
  --bad:#ff5d6c;
  --warn:#ffc44d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1100px 640px at 12% -12%, #1c2a55 0%, transparent 60%),
    radial-gradient(900px 560px at 37% 6%, #3a1f5c 0%, transparent 55%),
    linear-gradient(180deg,#0b1020,#131a33);
  background-attachment:fixed;
  color:var(--text);
  font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  min-height:100%;
}
button{font-family:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 26px;
      padding-bottom:calc(26px + env(safe-area-inset-bottom))}

/* ===================== 顶栏 ===================== */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:.4px}
.logo .mark{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 6px 18px rgba(110,168,255,.35)
}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}
.spacer{flex:1}

.diffs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--panel-line);padding:4px;border-radius:12px}
.diffs button{
  border:0;background:transparent;padding:7px 13px;border-radius:9px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--muted);transition:.18s;min-height:34px
}
.diffs button:hover{color:var(--text)}
.diffs button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 14px rgba(110,168,255,.3)}

/* ===================== 按钮 ===================== */
.btn{
  border:1px solid var(--panel-line);background:var(--panel);color:var(--text);
  padding:10px 16px;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;
  transition:.18s;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px
}
.btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.btn.primary{
  border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 6px 18px rgba(110,168,255,.32)
}
.btn.primary:disabled{box-shadow:none}
.btn.ghost{background:transparent}

/* ===================== 状态条 ===================== */
.bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;
  padding:10px 13px;margin-bottom:12px
}
.bar .item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.bar .item b{color:var(--text);font-size:15px;font-variant-numeric:tabular-nums}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  font-size:12.5px;font-weight:700;border:1px solid var(--panel-line);background:rgba(255,255,255,.04)
}
.pill.idle{color:var(--muted)}
.pill.you{color:var(--accent);border-color:rgba(110,168,255,.5);background:rgba(110,168,255,.12)}
.pill.ai{color:var(--warn);border-color:rgba(255,196,77,.5);background:rgba(255,196,77,.12)}
.pill.over{color:var(--ok);border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.12)}
.lives{display:flex;gap:3px;align-items:center}
.shipdot{width:13px;height:9px;border-radius:2.5px;background:var(--accent);opacity:.9;display:inline-block}
.shipdot.dead{background:var(--bad);opacity:.45;position:relative}
.shipdot.dead::after{content:"";position:absolute;inset:0;background:
  linear-gradient(45deg,transparent 44%,#fff 44%,#fff 56%,transparent 56%)}

/* ===================== 棋盘布局 ===================== */
.boards{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.panel{
  flex:1 1 420px;min-width:300px;
  background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:12px
}
.panel h2{
  margin:0 0 9px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:9px;letter-spacing:.3px
}
.panel h2 .tag{
  font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;
  border:1px solid var(--panel-line);color:var(--muted)
}
.panel.mine h2 .badge{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.panel.foe h2 .badge{background:linear-gradient(135deg,#ff8a5b,var(--bad))}
.panel h2 .badge{
  width:9px;height:9px;border-radius:50%;flex:0 0 auto
}
.panel.foe.armed{border-color:rgba(110,168,255,.45);box-shadow:0 0 0 1px rgba(110,168,255,.2),0 8px 26px rgba(110,168,255,.09)}
.panel.mine.armed{border-color:rgba(161,107,255,.45);box-shadow:0 0 0 1px rgba(161,107,255,.2)}

/* ===================== 网格 ===================== */
/* 单个 board：7 列 × 7 行（1 个表头轨道 + 6 个棋盘轨道） */
.board{
  display:grid;
  grid-template-columns:17px repeat(6, minmax(40px, 1fr));
  gap:6px;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none
}
.corner{grid-column:1;grid-row:1}
.colhead,.rowhead{
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);
  font-variant-numeric:tabular-nums
}
.cell{
  position:relative;aspect-ratio:1/1;min-width:40px;min-height:40px;
  border-radius:8px;border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.045);
  cursor:pointer;transition:background .14s,transform .1s,box-shadow .14s;
  display:grid;place-items:center;
  user-select:none;-webkit-user-select:none
}
.cell:hover{background:rgba(255,255,255,.11)}
.cell:active{transform:scale(.97)}
.cell.flat{cursor:default}
.cell.flat:hover{background:rgba(255,255,255,.045)}

/* 自己的船 */
.cell.ship{
  background:linear-gradient(180deg,rgba(110,168,255,.42),rgba(110,168,255,.24));
  border-color:rgba(110,168,255,.55);box-shadow:inset 0 0 12px rgba(110,168,255,.14)
}
/* 预览 */
.cell.preview-ok{
  background:linear-gradient(180deg,rgba(61,220,151,.42),rgba(61,220,151,.2));
  border-color:rgba(61,220,151,.75)
}
.cell.preview-bad{
  background:linear-gradient(180deg,rgba(255,93,108,.48),rgba(255,93,108,.24));
  border-color:rgba(255,93,108,.85)
}
/* 命中 / 未中 */
.cell.hit{background:linear-gradient(180deg,rgba(255,93,108,.5),rgba(255,93,108,.28));border-color:rgba(255,93,108,.75)}
.cell.hit::after{content:"✕";font-size:min(4.2vw,19px);font-weight:900;color:#fff;
  text-shadow:0 0 9px rgba(255,93,108,.95)}
.cell.miss{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);cursor:default}
.cell.miss::after{content:"";width:8px;height:8px;border-radius:50%;background:rgba(143,154,192,.75)}
.cell.sunk{
  background:repeating-linear-gradient(45deg,rgba(0,0,0,.5) 0 5px,rgba(20,10,20,.5) 5px 10px),
             linear-gradient(180deg,rgba(255,93,108,.28),rgba(0,0,0,.35));
  border-color:rgba(255,93,108,.55)
}
.cell.sunk::after{content:"✕";font-size:min(4.2vw,19px);font-weight:900;color:rgba(255,255,255,.92)}
.cell.sunk-ally{
  background:repeating-linear-gradient(45deg,rgba(0,0,0,.45) 0 5px,rgba(30,12,24,.45) 5px 10px),
             linear-gradient(180deg,rgba(255,93,108,.22),rgba(0,0,0,.3));
  border-color:rgba(255,93,108,.45)
}
.cell.sunk-ally::after{content:"✕";font-size:min(4.2vw,19px);font-weight:900;color:rgba(255,255,255,.85)}

.cell.ship.hit{background:linear-gradient(180deg,rgba(255,93,108,.55),rgba(255,93,108,.32))}

/* 上次落点脉冲 */
@keyframes pop{0%{box-shadow:0 0 0 0 rgba(255,255,255,.65)}100%{box-shadow:0 0 0 11px rgba(255,255,255,0)}}
.cell.last{animation:pop .55s ease-out}

/* ===================== 开火动画 ===================== */
/* 命中：标记弹入 + 涟漪 */
@keyframes hitIn{
  0%{transform:scale(.2);opacity:0}
  55%{transform:scale(1.22);opacity:1}
  100%{transform:scale(1);opacity:1}
}
@keyframes hitRipple{
  0%{box-shadow:0 0 0 0 rgba(255,93,108,.85)}
  100%{box-shadow:0 0 0 16px rgba(255,93,108,0)}
}
.cell.fx-hit{animation:hitIn .3s ease-out, hitRipple .42s ease-out}
.cell.fx-hit::after{animation:hitIn .3s ease-out}

/* 未中：灰点淡入 */
@keyframes missIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.cell.fx-miss{animation:missIn .2s ease-out}

/* 击沉：整艘船闪红 */
@keyframes sunkFlash{
  0%,100%{background:rgba(120,20,30,.55)}
  50%{background:rgba(255,93,108,.85);box-shadow:0 0 14px rgba(255,93,108,.8)}
}
.cell.fx-sunk{animation:sunkFlash .42s ease-in-out 2}

/* AI 瞄准提示 */
@keyframes aimBlink{0%,100%{border-color:rgba(255,93,108,.2)}50%{border-color:rgba(255,93,108,.85)}}
.cell.fx-aim{animation:aimBlink .3s ease-in-out}

.cell.disabled{cursor:not-allowed}

/* ===================== 新手教程 ===================== */
.btn.icon{
  width:34px;height:34px;padding:0;display:grid;place-items:center;
  font-size:15px;flex:0 0 auto
}
.card.tut{position:relative;max-width:430px;text-align:center}
.tut-x{
  position:absolute;top:10px;right:10px;width:28px;height:28px;
  border:1px solid var(--panel-line);background:transparent;color:var(--muted);
  border-radius:8px;cursor:pointer;font-size:13px;line-height:1
}
.tut-x:hover{background:rgba(255,255,255,.08);color:var(--text)}
.tut-step{
  font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;
  font-variant-numeric:tabular-nums
}
.tut-icon{font-size:42px;line-height:1;margin-bottom:10px}
.tut-body{
  color:#c3ccea;font-size:13.5px;line-height:1.85;text-align:left;
  margin:0 0 18px;min-height:110px
}
.tut-body ul{margin:6px 0;padding-left:20px}
.tut-body li{margin:4px 0}
.tut-body b{color:#fff}
.tut-body code{
  background:rgba(255,255,255,.11);padding:1px 6px;border-radius:5px;
  font-family:Consolas,monospace;font-size:12.5px
}
.tut-body .mark{
  display:inline-block;min-width:22px;text-align:center;padding:0 4px;
  border-radius:5px;font-size:12px;margin-right:4px
}
.m-hit{background:rgba(255,93,108,.3);color:#ff9aa4}
.m-miss{background:rgba(143,154,192,.25);color:#c3ccea}
.m-sunk{background:rgba(60,20,30,.7);color:#ff9aa4}
.tut-nav{display:flex;gap:9px}
.tut-nav .btn{flex:1 1 0;margin-top:0}
.tut-nav .btn+.btn{margin-top:0}

@media (max-width:560px){
  .card.tut{max-width:100%;padding:20px 16px}
  .tut-body{font-size:13px;min-height:120px}
  .tut-icon{font-size:36px}
}

/* ===================== 消息 ===================== */
.logbox{
  margin-top:13px;background:var(--panel);border:1px solid var(--panel-line);
  border-radius:14px;padding:11px 13px
}
.logbox .hd{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:7px;letter-spacing:.4px}
#log{list-style:none;margin:0;padding:0;max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
#log li{
  font-size:13.5px;line-height:1.45;padding:6px 10px;border-radius:9px;
  background:rgba(255,255,255,.04);border-left:3px solid rgba(255,255,255,.16);
  animation:fade .22s ease-out
}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#log li.you{border-left-color:var(--accent);background:rgba(110,168,255,.1)}
#log li.ai{border-left-color:var(--warn);background:rgba(255,196,77,.09)}
#log li.good{border-left-color:var(--ok);background:rgba(61,220,151,.11)}
#log li.bad{border-left-color:var(--bad);background:rgba(255,93,108,.11)}

/* ===================== 控制区 ===================== */
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.controls .grow{flex:1}
.hint{font-size:12.5px;color:var(--muted);margin-top:9px;line-height:1.5}
kbd{
  background:rgba(255,255,255,.1);border:1px solid var(--panel-line);border-bottom-width:2px;
  border-radius:5px;padding:1px 6px;font-size:11.5px;font-family:inherit;font-weight:700;color:var(--text)
}
.place-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.place-chip{
  display:flex;align-items:center;gap:7px;font-size:12.5px;padding:6px 11px;border-radius:999px;
  border:1px solid var(--panel-line);background:rgba(255,255,255,.04);color:var(--muted);font-weight:600
}
.place-chip.active{border-color:var(--accent);color:var(--accent);background:rgba(110,168,255,.12)}
.place-chip.done{opacity:.5;text-decoration:line-through}
.place-chip .mini{display:flex;gap:2px}
.place-chip .mini i{width:9px;height:9px;border-radius:2px;background:currentColor;display:block}

/* ===================== 结束浮层 ===================== */
.overlay{
  position:fixed;inset:0;background:rgba(4,7,18,.78);backdrop-filter:blur(6px);
  display:none;place-items:center;padding:20px;z-index:50
}
.overlay.show{display:grid;animation:fade .25s ease-out}
.card{
  width:min(400px,100%);background:linear-gradient(180deg,rgba(30,40,78,.96),rgba(19,26,51,.98));
  border:1px solid var(--panel-line);border-radius:20px;padding:24px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.6)
}
.card .big{font-size:52px;line-height:1;margin-bottom:8px}
.card h3{margin:0 0 8px;font-size:23px;letter-spacing:.5px}
.card h3.win{color:var(--ok)}
.card h3.lose{color:var(--bad)}
.card p{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.6}
.card .btn{width:100%;justify-content:center}
.card .btn+.btn{margin-top:9px}

@media (max-width:820px){
  .boards{flex-direction:column}
  .panel{flex:1 1 auto;width:100%}
  .wrap{padding:11px 11px 22px}
  .logo{font-size:17px}
  .bar{padding:9px 11px;gap:8px}
  .board{gap:5px;grid-template-columns:15px repeat(6, minmax(40px, 1fr))}
  #log{max-height:120px}
}
@media (max-width:400px){
  .cell{min-width:40px;min-height:40px}
  .board{gap:4px;grid-template-columns:14px repeat(6, minmax(40px, 1fr))}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">
      <span class="mark">🚢</span>
      <span>海战棋
        <small>6×6 · 单机对战电脑</small>
      </span>
    </div>
    <div class="spacer"></div>
    <div class="diffs" id="diffs">
      <button data-diff="easy">简单</button>
      <button data-diff="normal" class="active">普通</button>
      <button data-diff="hard">困难</button>
    </div>
    <button class="btn icon" id="btnTut" title="玩法教程">❓</button>
    <button class="btn icon" id="btnSound" title="音效开关">🔊</button>
  </header>

  <div class="bar">
    <span class="pill idle" id="phasePill">布阵阶段</span>
    <span class="item">你的舰船 <span class="lives" id="myLives"></span></span>
    <span class="item">敌方舰船 <span class="lives" id="foeLives"></span></span>
    <div class="spacer"></div>
    <span class="item">剩余未放 <b id="leftToPlace">3</b></span>
  </div>

  <div class="boards">

    <div class="panel mine armed" id="myPanel">
      <h2><span class="badge"></span>你的海域 <span class="tag">友方</span></h2>
      <div class="board" id="myGrid"><div class="corner"></div></div>
      <div class="place-list" id="placeList"></div>
      <div class="hint" id="myHint">点击格子放置舰船 · <kbd>R</kbd> 或右键切换方向</div>
    </div>

    <div class="panel foe" id="foePanel">
      <h2><span class="badge"></span>敌方海域 <span class="tag">点击开火</span></h2>
      <div class="board" id="foeGrid"><div class="corner"></div></div>
      <div class="hint" id="foeHint">布阵完成后点击「开始战斗」，然后点击此棋盘开火。</div>
    </div>

  </div>

  <div class="logbox">
    <div class="hd">战斗日志</div>
    <ul id="log"></ul>
  </div>

  <div class="controls" id="controls">
    <button class="btn primary grow" id="btnStart">开始战斗</button>
    <button class="btn" id="btnRotate">旋转 (R)</button>
    <button class="btn" id="btnRandom">随机布阵</button>
    <button class="btn ghost" id="btnReset">重新布阵</button>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="card">
    <div class="big" id="ovIcon">🏆</div>
    <h3 id="ovTitle">胜利</h3>
    <p id="ovText"></p>
    <button class="btn primary" id="ovAgain">再来一局</button>
  </div>
</div>

<!-- 新手教程 -->
<div class="overlay" id="tutorial">
  <div class="card tut">
    <button class="tut-x" id="tutX" title="关闭">✕</button>
    <div class="tut-step" id="tutStep">1 / 4</div>
    <div class="tut-icon" id="tutIcon">🗺️</div>
    <h3 id="tutTitle">认识棋盘</h3>
    <div class="tut-body" id="tutBody"></div>
    <div class="tut-nav">
      <button class="btn" id="tutPrev">上一步</button>
      <button class="btn primary" id="tutNext">下一步</button>
    </div>
  </div>
</div>

<!-- 发现未完成对局 -->
<div class="overlay" id="resume">
  <div class="card">
    <div class="big">💾</div>
    <h3>发现未完成的对局</h3>
    <p id="resumeText"></p>
    <div class="tut-nav">
      <button class="btn primary" id="resumeYes">继续上局</button>
      <button class="btn" id="resumeNo">重新开始</button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   FX —— 统一音效 + 动画模块（各游戏内联同一份，保持手感一致）
   -------------------------------------------------------------------------
   设计要点：
   · 纯 WebAudio 合成，无音频文件，离线可用
   · 支持「音调改变」：tone() 可指定频率，slide() 可做上滑/下滑
   · 浏览器要求首次交互后才能出声，已自动解锁
   · 音效开关持久化到 localStorage
   ========================================================================= */
var FX = (function () {
  var ctx = null;
  var enabled = true;
  var VOL = 0.07;

  function ac() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { return null; }
    }
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }

  /* 单音：freq 频率(Hz) · dur 时长(s) · type 波形 · vol 音量 · when 延迟(s) */
  function tone(freq, dur, type, vol, when) {
    if (!enabled) return;
    var c = ac(); if (!c) return;
    var t0 = c.currentTime + (when || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || VOL, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  /* 滑音：从 f1 滑到 f2 —— 「音调改变」的核心效果 */
  function slide(f1, f2, dur, type, vol) {
    if (!enabled) return;
    var c = ac(); if (!c) return;
    var t0 = c.currentTime;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';

    list.forEach(function(p){
      var cl = cellAt(myGrid,p[0],p[1]);
      cl.classList.add(legal ? 'preview-ok' : 'preview-bad');
    });
  }
  if(state.phase !== 'place'){
    Array.prototype.forEach.call(myGrid.querySelectorAll('.cell'), function(el){ el.classList.add('flat'); });
  }
}

function renderFoeBoard(){
  var g = state.foeShots || E.emptyBoard(0);
  for(var r=0;r<SIZE;r++) for(var c=0;c<SIZE;c++){
    var cell = cellAt(foeGrid,c,r);
    cell.className = 'cell';
    var v = g[r][c];
    if(v === 1){
      cell.classList.add('miss');
      cell.classList.add('flat');
    } else if(v === 3){
      cell.classList.add('sunk'); cell.classList.add('flat');
    } else if(v === 2){
      // 命中：整船是否已沉？
      var ship = E.shipAt(state.foeFleet,c,r);
      if(ship && ship.hits.length >= ship.size) cell.classList.add('sunk');
      else cell.classList.add('hit');
      cell.classList.add('flat');
    }
    if(state.phase === 'battle' && state.turn === 'you' && !state.busy && v === 0){
      cell.classList.remove('flat');
    } else {
      cell.classList.add('flat');
    }
  }
}

function lives(listEl, fleet){
  listEl.innerHTML = '';
  fleet.ships.forEach(function(s){
    var d = document.createElement('span');
    d.className = 'shipdot' + (s.hits.length >= s.size ? ' dead' : '');
    d.title = s.name + '（' + s.size + '格）';
    listEl.appendChild(d);
  });
}

function renderStatus(){
  lives($('myLives'), state.myFleet);
  lives($('foeLives'), state.foeFleet);
  $('leftToPlace').textContent = Math.max(0, SHIPS.length - state.placedCount);
  var pill = $('phasePill');
  if(state.phase === 'place'){ pill.className = 'pill idle'; pill.textContent = '布阵阶段'; }
  else if(state.phase === 'over'){ pill.className = 'pill over'; pill.textContent = '战斗结束'; }
  else if(state.turn === 'you'){ pill.className = 'pill you'; pill.textContent = '轮到你开火'; }
  else { pill.className = 'pill ai'; pill.textContent = '电脑思考中…'; }

  $('myPanel').classList.toggle('armed', state.phase==='place' || (state.phase==='battle' && state.turn==='ai'));
  $('foePanel').classList.toggle('armed', state.phase==='battle' && state.turn==='you' && !state.busy);

  var pl = $('placeList'); pl.innerHTML='';
  SHIPS.forEach(function(s,i){
    var chip = document.createElement('span');
    chip.className = 'place-chip' + (i < state.placedCount ? ' done' : (i === state.nextShip && state.phase==='place' ? ' active' : ''));
    var mini = '<span class="mini">';
    for(var k=0;k<s.size;k++) mini += '<i></i>';
    mini += '</span>';
    chip.innerHTML = mini + s.name + ' · ' + s.size + '格';
    pl.appendChild(chip);
  });

  $('myHint').innerHTML = state.phase === 'place'
    ? '点击格子放置舰船 · <kbd>R</kbd> 或右键切换方向（当前：' + (state.horiz?'横向':'纵向') + '）'
    : '这里显示你的舰船与敌方命中情况。';
}

function renderControls(){
  $('btnStart').disabled = !(state.phase === 'place' && state.placedCount >= SHIPS.length);
  $('btnRotate').disabled = state.phase !== 'place';
  $('btnRandom').disabled = false;
  $('btnReset').disabled = state.phase === 'place' && state.placedCount === 0;
}

function log(text, cls){
  var li = document.createElement('li');
  li.className = cls || '';
  li.textContent = text;
  logEl.insertBefore(li, logEl.firstChild);
  while(logEl.children.length > 60) logEl.removeChild(logEl.lastChild);
}

/* ---------- 布阵交互 ---------- */
function doRotate(){
  if(state.phase !== 'place') return;
  state.horiz = !state.horiz;
  FX.click();
  renderMyBoard(); renderStatus();
}
function doRandom(){
  if(state.phase !== 'place') return;
  state.myFleet = E.randomFleet();
  state.placedCount = SHIPS.length;
  state.nextShip = SHIPS.length;
  state.hover = null;
  FX.click();
  saveGame();
  render();
}
function doReset(){
  state.myFleet = E.makeFleet();
  state.placedCount = 0; state.nextShip = 0; state.hover = null;
  state.myShots = E.emptyBoard(0); state.myShotsHit = E.emptyBoard(0);
  FX.click();
  Save.clear('battleship');
  render();
  log('已清空重新布阵。', '');
}
function tryPlace(c, r){
  if(state.phase !== 'place') return;
  if(state.placedCount >= SHIPS.length) return;
  var sh = SHIPS[state.nextShip];
  if(!E.canPlace(state.myFleet.occupied, c, r, sh.size, state.horiz)){
    // 判断是越界还是重叠，给出更精确的反馈
    var cells = E.shipCells(c, r, sh.size, state.horiz);
    if(!cells){ log('放不下：超出棋盘边界。', 'bad'); }
    else { log('放不下：与已有舰船重叠。', 'bad'); }
    FX.bad();
    return;
  }
  var cells2 = E.shipCells(c, r, sh.size, state.horiz);
  E.fleetPlace(state.myFleet, state.nextShip, cells2);
  state.placedCount++;
  state.nextShip = state.placedCount;
  state.hover = null;
  log('已放置「' + sh.name + '」于 ' + E.coordName(c,r) + '（' + (state.horiz?'横':'竖') + '向，' + sh.size + '格）。', 'you');
  FX.place();
  saveGame();
  render();
}

/* =========================================================================
   存档：未打完的对局下次可继续
   ========================================================================= */
function saveGame(){
  if (state.phase === 'over') return;
  // 布阵阶段还没放船就不必存
  if (state.phase === 'place' && !state.placedCount) { Save.clear('battleship'); return; }
  Save.write('battleship', {
    phase: state.phase,
    difficulty: state.difficulty,
    turn: state.turn,
    myFleet: state.myFleet,
    foeFleet: state.foeFleet,
    foeShots: state.foeShots,
    myShots: state.myShots,
    myShotsHit: state.myShotsHit,
    placedCount: state.placedCount,
    nextShip: state.nextShip,
    combo: state.combo || 0,
    ai: state.myAI && state.myAI.exportState ? state.myAI.exportState() : null
  });
}
function restoreGame(s){
  if (!s) { newGame(); return; }     // 存档为空时安全兜底
  state.phase = s.phase || 'place';
  state.difficulty = s.difficulty || 'normal';
  state.turn = s.turn || 'you';
  state.myFleet = s.myFleet || E.makeFleet();
  state.foeFleet = s.foeFleet || E.makeFleet();
  state.foeShots = s.foeShots || E.emptyBoard(0);
  state.myShots = s.myShots || E.emptyBoard(0);
  state.myShotsHit = s.myShotsHit || E.emptyBoard(0);
  state.placedCount = s.placedCount || 0;
  state.nextShip = s.nextShip || 0;
  state.combo = s.combo || 0;
  state.busy = false;
  state.horiz = true;
  state.hover = null;
  state.myAI = E.createAI(state.difficulty);
  if (s.ai && state.myAI.importState) state.myAI.importState(s.ai);
  logEl.innerHTML = '';
  log('已恢复上局。阶段：' + (state.phase === 'battle' ? '战斗' : '布阵') + '。', 'good');
  render();
}
function checkSave(){
  var s = Save.read('battleship');
  if (!s) return false;
  if (s.phase === 'over') { Save.clear('battleship'); return false; }
  if (s.phase === 'place' && !s.placedCount) { Save.clear('battleship'); return false; }
  var myLeft = (s.myFleet && s.myFleet.ships)
    ? s.myFleet.ships.filter(function(x){ return x.hits.length < x.size; }).length : 3;
  var txt = s.phase === 'battle'
    ? ('阶段：战斗 · 你的船还剩 ' + myLeft + ' 艘 · 难度：' + diffName(s.difficulty))
    : ('阶段：布阵 · 已放 ' + s.placedCount + ' 艘');
  $('resumeText').textContent = txt;
  $('resume').classList.add('show');
  return true;
}

/* ---------- 战斗 ---------- */
function startBattle(){
  if(state.phase !== 'place') return;
  if(state.placedCount < SHIPS.length){
    log('请先放置全部 ' + SHIPS.length + ' 艘舰船。', 'bad');
    return;
  }
  state.phase = 'battle';
  state.turn = 'you';
  state.busy = false;
  state.combo = 0;
  state.foeFleet = E.randomFleet();
  state.foeShots = E.emptyBoard(0);      // 对敌方海域的射击记录（玩家视角）
  state.myShots = E.emptyBoard(0);       // 对己方海域的射击记录（AI 打出的）
  state.myShotsHit = E.emptyBoard(0);
  state.foeShotsHit = E.emptyBoard(0);
  state.history = [];
  state.hover = null;
  state.myAI = E.createAI(state.difficulty);
  log('战斗开始！你先行。难度：' + diffName(state.difficulty) + '。', 'good');
  FX.good();
  saveGame();
  render();
}
function diffName(d){ return d==='easy'?'简单':(d==='hard'?'困难':'普通'); }

function playerFire(c, r){
  if(state.phase !== 'battle' || state.turn !== 'you' || state.busy) return;
  if(state.foeShots[r][c] !== 0) return;
  var res = E.fleetFire(state.foeFleet, c, r);
  var name = E.coordName(c,r);
  if(res === 'miss'){
    state.foeShots[r][c] = 1;
    state.combo = 0;
    log('你开火 ' + name + '：未命中。', '');
    FX.miss();
    fxCell(foeGrid, c, r, 'miss');
  } else {
    state.foeShots[r][c] = res === 'sunk' ? 3 : 2;
    state.combo = (state.combo || 0) + 1;
    if(res === 'sunk'){
      var ship = E.shipAt(state.foeFleet,c,r);
      log('你击沉了电脑的「' + ship.name + '」！', 'good');
      markSunkOnFoe(ship);
      FX.explode();
      FX.step(state.combo + 2);           // 击沉给更高音
      ship.cells.forEach(function(p){ fxCell(foeGrid, p[0], p[1], 'sunk'); });
    } else {
      log('你击中了 ' + name + '！', 'you');
      FX.hit();
      if (state.combo > 1) FX.step(state.combo);   // 连击音调递增
      fxCell(foeGrid, c, r, 'hit');
    }
  }
  pulse(foeGrid,c,r);
  renderUIOnly();
  saveGame();

  if(E.fleetAllSunk(state.foeFleet)){ endGame('you'); return; }

  state.turn = 'ai';
  state.busy = true;
  renderUIOnly();
  scheduleAI();
}

function markSunkOnFoe(ship){
  ship.cells.forEach(function(p){
    state.foeShots[p[1]][p[0]] = 3;
  });
}

function pulse(gridEl,c,r){
  var el = cellAt(gridEl,c,r);
  el.classList.remove('last');
  void el.offsetWidth;
  el.classList.add('last');
}

/** 给某个格子加一次性动画类，动画结束自动移除（不影响状态） */
function fxCell(gridEl, c, r, kind){
  var el = cellAt(gridEl, c, r);
  if(!el) return;
  var cls = 'fx-' + kind;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(function(){ el.classList.remove(cls); }, 900);
}

/** 只刷新两侧棋盘与状态栏，不重建按钮（避免吞掉动画） */
function renderUIOnly(){
  renderMyBoard();
  renderFoeBoard();
  renderStatus();
}

function scheduleAI(){
  clearTimeout(state.aiTimer);
  state.aiTimer = setTimeout(aiTurn, 620);
}

function aiTurn(){
  if(state.phase !== 'battle' || state.turn !== 'ai') return;
  var pick = state.myAI.nextShot();
  if(!pick){ // 理论上不会发生；兜底
    state.turn = 'you'; state.busy = false; render(); return;
  }
  var c = pick[0], r = pick[1];
  // 绝不重复
  if(state.myShotsHit[r][c] !== 0){ state.turn='you'; state.busy=false; render(); return; }
  var res = E.fleetFire(state.myFleet, c, r);
  var name = E.coordName(c,r);
  var sunkCells = null;
  if(res === 'repeat'){
    state.myAI.feedback(c,r,'miss');
    state.myShotsHit[r][c] = 1;
    log('电脑开火 ' + name + '：未命中。', 'ai');
    FX.miss();
    fxCell(myGrid, c, r, 'miss');
  } else if(res === 'miss'){
    state.myAI.feedback(c,r,'miss');
    state.myShotsHit[r][c] = 1;
    log('电脑开火 ' + name + '：未命中。', 'ai');
    FX.miss();
    fxCell(myGrid, c, r, 'miss');
  } else if(res === 'hit'){
    state.myAI.feedback(c,r,'hit');
    state.myShotsHit[r][c] = 2;
    log('电脑击中了你的 ' + name + '！', 'bad');
    FX.bad();
    fxCell(myGrid, c, r, 'hit');
  } else if(res === 'sunk'){
    var ship = E.shipAt(state.myFleet,c,r);
    sunkCells = ship.cells.map(function(p){ return [p[0],p[1]]; });
    state.myAI.feedback(c,r,'sunk',ship.cells);
    state.myShotsHit[r][c] = 2;
    ship.cells.forEach(function(p){ state.myShotsHit[p[1]][p[0]] = 2; });
    log('电脑击沉了你的「' + ship.name + '」！', 'bad');
    FX.explode();
    ship.cells.forEach(function(p){ fxCell(myGrid, p[0], p[1], 'sunk'); });
  }
  pulse(myGrid,c,r);
  renderUIOnly();
  saveGame();

  if(E.fleetAllSunk(state.myFleet)){ endGame('ai'); return; }

  state.turn = 'you';
  state.busy = false;
  renderUIOnly();
}

function endGame(winner){
  state.phase = 'over';
  state.turn = null;
  state.busy = false;
  clearTimeout(state.aiTimer);
  render();
  var win = winner === 'you';
  $('ovIcon').textContent = win ? '🏆' : '💥';
  $('ovTitle').textContent = win ? '胜利！' : '战败…';
  $('ovTitle').className = win ? 'win' : 'lose';
  var myLeft = state.myFleet.ships.filter(function(s){ return s.hits.length < s.size; }).length;
  var foeLeft = state.foeFleet.ships.filter(function(s){ return s.hits.length < s.size; }).length;
  $('ovText').textContent = win
    ? ('你击沉了电脑全部 3 艘舰船，自身还剩 ' + myLeft + ' 艘。难度：' + diffName(state.difficulty) + '。')
    : ('你的舰队被全歼了，电脑还剩 ' + foeLeft + ' 艘。换个策略再试试？');
  $('overlay').classList.add('show');
  log(win ? '★ 你赢了！' : '× 你输了。', win ? 'good' : 'bad');
  Save.clear('battleship');       // 对局结束，清档
  if (win) FX.win(); else FX.lose();
}

function newGame(){
  clearTimeout(state.aiTimer);
  $('overlay').classList.remove('show');
  state.phase = 'place';
  state.turn = 'you';
  state.busy = false;
  state.horiz = true;
  state.placedCount = 0; state.nextShip = 0; state.hover = null;
  state.myFleet = E.makeFleet();
  state.foeFleet = E.makeFleet();
  state.foeShots = E.emptyBoard(0);
  state.myShots = E.emptyBoard(0);
  state.myShotsHit = E.emptyBoard(0);
  state.foeShotsHit = E.emptyBoard(0);
  state.combo = 0;
  logEl.innerHTML = '';
  log('新的一局。请布阵，或直接点「随机布阵」。', 'good');
  /* 注意：这里不能无条件清档。
     newGame() 在页面初始化时也会被调用，若清档，刷新后就永远
     看不到「继续上局」了（实测发现的真 bug）。
     清档只由用户主动操作触发（resumeNo / ovAgain / 对局结束）。 */
  FX.click();
  render();
}

/* ---------- 事件绑定（点击 + 触摸友好） ---------- */
function bindEvents(){
  function hit(e){
    var t = e.target.closest ? e.target.closest('.cell') : null;
    if(!t) return null;
    return { c:+t.dataset.c, r:+t.dataset.r, side:t.dataset.side };
  }
  myGrid.addEventListener('click', function(e){
    var h = hit(e); if(!h) return;
    if(state.phase === 'place') tryPlace(h.c, h.r);
  });
  myGrid.addEventListener('mousemove', function(e){
    if(state.phase !== 'place') return;
    var h = hit(e); if(!h) return;
    if(!state.hover || state.hover[0]!==h.c || state.hover[1]!==h.r){
      state.hover = [h.c,h.r]; renderMyBoard();
  }
  });
  myGrid.addEventListener('mouseleave', function(){
    if(state.hover){ state.hover = null; renderMyBoard(); }
  });
  myGrid.addEventListener('contextmenu', function(e){
    e.preventDefault(); doRotate();
  });
  myGrid.addEventListener('touchstart', function(e){
    if(state.phase !== 'place') return;
    var t = e.touches && e.touches[0];
    if(!t) return;
    var el = document.elementFromPoint(t.clientX, t.clientY);
    var hitEl = el && el.closest ? el.closest('.cell') : null;
    if(hitEl && hitEl.dataset.side === 'mine'){
      state.hover = [+hitEl.dataset.c, +hitEl.dataset.r];
      renderMyBoard();
    }
  }, {passive:true});
  foeGrid.addEventListener('click', function(e){
    var h = hit(e); if(!h) return;
    playerFire(h.c, h.r);
  });
  foeGrid.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  $('btnStart').addEventListener('click', startBattle);
  $('btnRotate').addEventListener('click', doRotate);
  $('btnRandom').addEventListener('click', doRandom);
  $('btnReset').addEventListener('click', doReset);
  $('ovAgain').addEventListener('click', function () {
    Save.clear('battleship');       // 用户主动开新局，清档
    newGame();
  });

  /* ---- 教程 ---- */
  $('btnTut').addEventListener('click', tutShow);
  $('tutX').addEventListener('click', tutClose);
  $('tutNext').addEventListener('click', tutNext);
  $('tutPrev').addEventListener('click', tutPrev);

  /* ---- 音效开关 ---- */
  function syncSoundBtn(){
    var b = $('btnSound');
    b.textContent = FX.on() ? '🔊' : '🔇';
    b.style.opacity = FX.on() ? '' : '.45';
  }
  $('btnSound').addEventListener('click', function(){
    FX.setEnabled(!FX.on());
    syncSoundBtn();
    if (FX.on()) FX.click();
  });

  /* ---- 继续上局 ---- */
  $('resumeYes').addEventListener('click', function(){
    $('resume').classList.remove('show');
    var s = Save.read('battleship');
    if (s) restoreGame(s);
    FX.click();
  });
  $('resumeNo').addEventListener('click', function(){
    $('resume').classList.remove('show');
    Save.clear('battleship');
    newGame();
  });

  $('diffs').addEventListener('click', function(e){
    var b = e.target.closest('button[data-diff]');
    if(!b) return;
    state.difficulty = b.dataset.diff;
    Array.prototype.forEach.call($('diffs').children, function(x){
      x.classList.toggle('active', x === b);
    });
    FX.click();
    if(state.phase === 'battle' && !state.busy){
      log('难度已切换为「' + diffName(state.difficulty) + '」（对电脑后续决策生效）。', '');
    } else {
      log('难度：' + diffName(state.difficulty) + '。', '');
    }
    saveGame();
  });
  document.addEventListener('keydown', function(e){
    var k = e.key ? e.key.toLowerCase() : '';
    if(k === 'r'){ doRotate(); }
    if(k === ' ' && state.phase === 'place'){ e.preventDefault(); doRandom(); }
  });

  return syncSoundBtn;
}

function init(){
  myGrid = $('myGrid'); foeGrid = $('foeGrid'); logEl = $('log');
  state.myShots = E.emptyBoard(0);
  state.myShotsHit = E.emptyBoard(0);
  state.foeShots = E.emptyBoard(0);
  state.foeShotsHit = E.emptyBoard(0);
  state.combo = 0;
  buildGrid(myGrid, 'mine');
  buildGrid(foeGrid, 'foe');
  var syncSoundBtn = bindEvents();

  /* 音效初始化 */
  FX.init();
  if (syncSoundBtn) syncSoundBtn();

  log('欢迎！先放置你的 3 艘舰船（3 / 2 / 2 格）。', 'good');
  render();

  /* 首次进入自动弹教程 */
  var seen = false;
  try { seen = localStorage.getItem('games.battleship.tut') === '1'; } catch (e) {}
  if (!seen) setTimeout(tutShow, 260);

  /* 有未完成对局则提示继续 */
  setTimeout(checkSave, 120);
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

/* 暴露给自动化测试 */
window.__BS_GAME = {
  state: state,
  newGame: newGame,
  startBattle: startBattle,
  tryPlace: tryPlace,
  doRotate: doRotate,
  doRandom: doRandom,
  doReset: doReset,
  playerFire: playerFire,
  aiTurn: aiTurn,
  render: render,
  cellAt: function(c,r){ return cellAt(foeGrid,c,r); },
  myCellAt: function(c,r){ return cellAt(myGrid,c,r); },
  /* 新增：教程 / 存档 / 音效 */
  tutShow: tutShow,
  tutNext: tutNext,
  tutPrev: tutPrev,
  tutClose: tutClose,
  tutIndex: function(){ return tutIdx; },
  tutTotal: function(){ return TUT.length; },
  save: saveGame,
  checkSave: checkSave,
  restoreGame: restoreGame,
  loadSave: function(){ return Save.read('battleship'); },
  clearSave: function(){ Save.clear('battleship'); },
  fx: FX,
  saveMod: Save
};

})();
</script>
</body>
</html>
